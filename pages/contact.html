<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Personal portfolio website of our five-member team."
  />

  <title>Our Portfolio | Contact</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  />

</head>


<body>

  <!-- =========================
       NAVIGATION
  ========================== -->

  <header class="site-header">

    <nav class="navbar">

      <div class="container nav-container">

        <a
          href="../index.html"
          class="brand"
        >
          SINGKO<span></span>
        </a>


        <button
          class="menu-toggle"
          id="menuToggle"
          type="button"
          aria-label="Toggle navigation"
        >
          ☰
        </button>


        <ul
          class="nav-links"
          id="navLinks"
        >

          <li>
            <a href="../index.html">
              Home
            </a>
          </li>

          <li>
            <a href="about.html">
              About Us
            </a>
          </li>

          <li>
            <a href="projects.html">
              Projects
            </a>
          </li>

          <li>
            <a
              href="contact.html"
              class="active"
            >
              Contact
            </a>
          </li>

        </ul>

      </div>

    </nav>

  </header>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main>


    <!-- =========================
         CONTACT
    ========================== -->

    <section
      id="contact"
      class="section"
    >

      <div class="container contact-container">


        <div class="contact-information">

          <p class="eyebrow">
            GET IN TOUCH
          </p>


          <h2>
            Contact our team
          </h2>


          <p class="contact-description">

            Have a question or want to connect with our team? Send us a
            message.

          </p>


          <div class="contact-details">


            <div class="contact-detail">

              <strong>
                Email
              </strong>


              <span>
                ourteam@example.com
              </span>

            </div>


            <div class="contact-detail">

              <strong>
                School
              </strong>


              <span>
                National University
              </span>

            </div>


            <div class="contact-detail">

              <strong>
                Course
              </strong>


              <span>
                Integrative Programming
              </span>

            </div>


          </div>

        </div>


        <!-- CONTACT FORM -->

        <form
          id="contactForm"
          class="contact-form"
          novalidate
        >

        <!-- =========================
                FULL NAME
          ========================== -->

          <div class="form-group">

            <label for="name">
              Full Name
            </label>


            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
            />


            <small
              class="error"
              id="nameError"
            ></small>

          </div>

          <!-- =========================
                EMAIL ADDRESS
          ========================== -->

          <div class="form-group">

            <label for="email">
              Email Address
            </label>


            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
            />


            <small
              class="error"
              id="emailError"
            ></small>

          </div>

          <!-- =========================
     SUBJECT
========================== -->

<div class="form-group">

  <label for="subject">
    Subject
  </label>


  <input
    type="text"
    id="subject"
    name="subject"
    placeholder="Enter the subject"
  />

</div>



          <!-- =========================
                MESSAGE
          ========================== -->

          <div class="form-group">

            <label for="message">
              Message
            </label>


            <textarea
              id="message"
              name="message"
              rows="6"
              placeholder="Write your message..."
            ></textarea>


            <small
              class="error"
              id="messageError"
            ></small>

          </div>



          <button
    type="submit"
    class="btn btn-primary full-width"
    id="sendButton"
>
    <span id="sendButtonText">Send Message</span>
    <span
        id="sendButtonSpinner"
        class="send-button-spinner"
        aria-hidden="true"
    ></span>
</button>


          <p
            id="formStatus"
            class="form-status"
          ></p>


        </form>


      </div>

    </section>


  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container footer-container">

      <p>

        ©
        <span id="currentYear"></span>

        Our Portfolio Team

      </p>


      <p>
        Built with HTML, CSS & JavaScript
      </p>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="../js/models.js"></script>

  <script src="../js/app.js"></script>

</body>

</html>
